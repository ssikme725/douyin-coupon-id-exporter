<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>优惠券商品 ID 导出</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <h1>优惠券商品 ID 导出</h1>
    <p>打开已登录的抖店优惠券详情页，点击下方按钮。</p>
    <button id="export" type="button">导出 Excel</button>
    <div id="status" role="status" aria-live="polite">准备就绪</div>
    <small>导出期间请保持弹窗打开，不要切换或修改优惠券。几千个商品需数分钟。数据不会上传到其他网站。</small>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
